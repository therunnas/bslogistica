name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 é o runtime LTS usado na Vercel. Os testes rodam com
      # --experimental-strip-types, que exige Node 22.6 ou superior — o mesmo
      # piso declarado em engines no package.json (>=22.6.0).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Teste cookies-supabase
        run: npm run test:cookies-supabase

      - name: Teste mfa
        run: npm run test:mfa

      - name: Teste recuperacao
        run: npm run test:recuperacao

      - name: Teste prova
        run: npm run test:prova

      - name: Teste troca
        run: npm run test:troca

      - name: Teste operacional
        run: npm run test:operacional

      - name: Teste papel
        run: npm run test:papel

      - name: Teste tela-operacional
        run: npm run test:tela-operacional

      - name: Teste admin-usuarios
        run: npm run test:admin-usuarios

      - name: Teste tela-usuarios
        run: npm run test:tela-usuarios

      - name: Teste configuracoes
        run: npm run test:configuracoes

      - name: Teste isolamento
        run: npm run test:isolamento

      - name: Teste paginacao
        run: npm run test:paginacao

      - name: Teste queries-paginacao
        run: npm run test:queries-paginacao

      - name: Teste ledger-estados
        run: npm run test:ledger-estados

      - name: Teste admin-paginacao
        run: npm run test:admin-paginacao

      - name: Teste apontamentos-leitura
        run: npm run test:apontamentos-leitura

      - name: Teste paridade-financeira
        run: npm run test:paridade-financeira

      - name: Teste integridade-contratos
        run: npm run test:integridade-contratos

      - name: Teste condicoes-expansao
        run: npm run test:condicoes-expansao

      - name: Teste registro-vigencias
        run: npm run test:registro-vigencias

      - name: Teste valores-operacao
        run: npm run test:valores-operacao

      - name: Teste apontamentos-salvar
        run: npm run test:apontamentos-salvar

      - name: Teste motor-vigencia
        run: npm run test:motor-vigencia

      - name: Teste interfaces-vigencia
        run: npm run test:interfaces-vigencia

      - name: Teste implantacao-vigencias
        run: npm run test:implantacao-vigencias

      - name: Teste vigencias-paginacao
        run: npm run test:vigencias-paginacao

      - name: Teste ativacao-motor
        run: npm run test:ativacao-motor

      - name: Teste regras-bs
        run: npm run test:regras-bs

      - name: Teste regras-definitivas
        run: npm run test:regras-definitivas

      - name: Teste fechamento-leitura
        run: npm run test:fechamento-leitura

      - name: Teste fechamento-dominio
        run: npm run test:fechamento-dominio

      - name: Teste fechamento-carregamento
        run: npm run test:fechamento-carregamento

      - name: Teste fechamento-tela
        run: npm run test:fechamento-tela

      - name: Teste fechamento-csv
        run: npm run test:fechamento-csv

      - name: Teste fechamento-xlsx
        run: npm run test:fechamento-xlsx

      - name: Teste fechamento-conciliacao
        run: npm run test:fechamento-conciliacao

      # O build pré-renderiza páginas que leem as variáveis públicas do Supabase
      # e falha sem elas, de propósito. Os valores abaixo são inertes: domínio
      # .invalid nunca resolve, e nenhum código roda contra um banco no build.
      # Este job não recebe secret nenhum e não alcança o Supabase de Production.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
